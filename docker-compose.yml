services:
  rdgen:
    # use bryangerlach/rdgen:latest for the latest build
    #build: .
    image: bryangerlach/rdgen:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SECRET_KEY: "${SECRET_KEY:-django-insecure-default}"
      GHUSER: "${GHUSER:-SamuelSilvaG}"
      GHBEARER: "${GHBEARER:-}"
      GENURL: "${GENURL:-http://localhost:8000}"
      ZIP_PASSWORD: "${ZIP_PASSWORD:-}"
      GHBRANCH: "${GHBRANCH:-master}"
      PROTOCOL: "${PROTOCOL:-https}"
      REPONAME: "${REPONAME:-rdgen}"
      SH_SECRET: "${SH_SECRET:-}"
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
    volumes:
      - ./exe:/opt/rdgen/exe
      - ./png:/opt/rdgen/png
      - ./temp_zips:/opt/rdgen/temp_zips
